name: build

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auto-update.yml', 'repatch.py']

permissions:
  contents: write

env:
  SRC_REPO: FongMi/Release
  REPO_TO: dimogu/nightly-sync
  APKTOOL_VER: 2.10.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 获取版本并判断
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OFFICIAL=$(gh api repos/$SRC_REPO/releases/latest --jq '.tag_name')
          echo "official=$OFFICIAL"
          OURS=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          echo "ours=$OURS"
          echo "official=$OFFICIAL" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            # 推送补丁脚本时强制重建，使改进立即生效于已发布版本
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${OURS#v}" = "$OFFICIAL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 已是最新
        if: steps.meta.outputs.skip == 'true'
        run: echo "版本 ${{ steps.meta.outputs.official }} 已处理，跳过"

      - name: 安装 Java / apktool
        if: steps.meta.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless python3 unzip wget
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          wget -q "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_${APKTOOL_VER}.jar" -O apktool.jar
          ls -la apktool.jar

      - name: 准备签名工具
        id: bt
        if: steps.meta.outputs.skip != 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "build-tools;34.0.0" >/dev/null
            BT="$ANDROID_HOME/build-tools/34.0.0"
          fi
          echo "bt=$BT" >> "$GITHUB_OUTPUT"
          "$BT/apksigner" --version

      - name: 下载发布产物
        if: steps.meta.outputs.skip != 'true'
        run: |
          mkdir -p apks
          for f in leanback-arm64_v8a leanback-armeabi_v7a mobile-arm64_v8a mobile-armeabi_v7a; do
            curl -sSL -o "apks/$f.apk" "https://github.com/$SRC_REPO/releases/download/${{ steps.meta.outputs.official }}/$f.apk"
            echo "$f.apk -> $(wc -c < apks/$f.apk) bytes"
          done

      - name: 处理并签名
        if: steps.meta.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          BT: ${{ steps.bt.outputs.bt }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > keystore.jks
          keytool -list -keystore keystore.jks -storepass "$STORE_PASSWORD" >/dev/null
          mkdir -p dec out release
          for f in leanback-arm64_v8a leanback-armeabi_v7a mobile-arm64_v8a mobile-armeabi_v7a; do
            echo "=== 处理 $f ==="
            rm -rf "dec/$f"; java -jar apktool.jar d -r -f -o "dec/$f" "apks/$f.apk" >/dev/null
            python3 repatch.py "dec/$f" "$REPO_TO"
            java -jar apktool.jar b -c -f -o "out/$f-unsigned.apk" "dec/$f" >/dev/null
            "$BT/zipalign" -f -p 4 "out/$f-unsigned.apk" "out/$f-aligned.apk"
            "$BT/apksigner" sign \
              --ks keystore.jks --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --out "release/$f.apk" "out/$f-aligned.apk"
            "$BT/apksigner" verify "release/$f.apk"
            echo "release/$f.apk 完成"
          done
          ls -la release/

      - name: 发布产物
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.official }}"
          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release/*.apk --clobber
              gh release edit "$TAG" --title "$TAG" --notes ""
            else
              gh release create "$TAG" \
                --title "$TAG" \
                --notes "" \
                release/*.apk
            fi
          }
          for i in 1 2 3; do
            if publish; then
              echo "发布成功（第 $i 次尝试）"
              exit 0
            fi
            echo "发布失败，第 $i 次重试..."
            sleep 15
          done
          echo "发布多次失败"
          exit 1

      - name: keep-alive
        if: github.event_name == 'schedule'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          TODAY=$(date -u +%F)
          PREV=""
          [ -f .lastrun ] && PREV=$(cat .lastrun)
          if [ "$PREV" != "$TODAY" ]; then
            echo "$TODAY" > .lastrun
            git add .lastrun
            git commit -m "keepalive: $TODAY"
            git push
            echo "心跳已提交：$TODAY"
          else
            echo "今日已心跳，跳过"
          fi
