name: repatch-auto-update

# 重打包官方已编译 APK，注入自动更新（绕开私有 aar 编译门槛）。
# 流程：每 6 小时检查 FongMi/Release 是否有新版 →
#   下载官方 4 个 APK → apktool 反编译 → repatch.py 改更新源+注入自动检查 →
#   重打包 → 用本仓库签名 keystore 重签名 → 发到本仓库 Release（同名 APK）。
# App 更新源指向本仓库，升级上来的版本依旧带自更新，形成闭环。

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auto-update.yml', 'repatch.py']

permissions:
  contents: write

env:
  REPO_TO: dimogu/nightly-sync
  APKTOOL_VER: 2.10.0

jobs:
  repatch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（取 repatch.py）
        uses: actions/checkout@v4

      - name: 安装 Java / apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless python3 unzip wget
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          wget -q "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_${APKTOOL_VER}.jar" -O apktool.jar
          ls -la apktool.jar

      - name: 准备签名工具（zipalign + apksigner）
        id: bt
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "build-tools;34.0.0" >/dev/null
            BT="$ANDROID_HOME/build-tools/34.0.0"
          fi
          echo "bt=$BT" >> "$GITHUB_OUTPUT"
          "$BT/apksigner" --version

      - name: 取官方最新版本 & 判断是否需构建
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OFFICIAL=$(gh api repos/FongMi/Release/releases/latest --jq '.tag_name')
          echo "official=$OFFICIAL"
          OURS=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          echo "ours=$OURS"
          echo "official=$OFFICIAL" >> "$GITHUB_OUTPUT"
          if [ "${OURS#v}" = "$OFFICIAL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 跳过（已是最新）
        if: steps.meta.outputs.skip == 'true'
        run: echo "官方版本 ${{ steps.meta.outputs.official }} 已发布，跳过"

      - name: 下载官方 4 个 APK
        if: steps.meta.outputs.skip != 'true'
        run: |
          mkdir -p apks
          for f in leanback-arm64_v8a leanback-armeabi_v7a mobile-arm64_v8a mobile-armeabi_v7a; do
            curl -sSL -o "apks/$f.apk" "https://github.com/FongMi/Release/releases/download/${{ steps.meta.outputs.official }}/$f.apk"
            echo "$f.apk -> $(wc -c < apks/$f.apk) bytes"
          done

      - name: 反编译 + 注入 + 重打包 + 签名
        if: steps.meta.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          BT: ${{ steps.bt.outputs.bt }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          # 尽早验证 keystore 完整性与口令，避免到最后一步才发现问题
          keytool -list -keystore keystore.jks -storepass "$STORE_PASSWORD" >/dev/null
          mkdir -p dec out release
          for f in leanback-arm64_v8a leanback-armeabi_v7a mobile-arm64_v8a mobile-armeabi_v7a; do
            echo "=== 处理 $f ==="
            rm -rf "dec/$f"; java -jar apktool.jar d -r -f -o "dec/$f" "apks/$f.apk" >/dev/null
            python3 repatch.py "dec/$f" "$REPO_TO"
            java -jar apktool.jar b -c -f -o "out/$f-unsigned.apk" "dec/$f" >/dev/null
            "$BT/zipalign" -f -p 4 "out/$f-unsigned.apk" "out/$f-aligned.apk"
            "$BT/apksigner" sign \
              --ks keystore.jks --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --out "release/$f.apk" "out/$f-aligned.apk"
            "$BT/apksigner" verify "release/$f.apk"
            echo "release/$f.apk 签名完成"
          done
          ls -la release/

      - name: 发布到本仓库 Release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tag 必须与官方完全一致（不带 v 前缀），否则 App 端版本比对永远匹配不上
          TAG="${{ steps.meta.outputs.official }}"
          # 复用官方同版本 release 的标题与说明，外观与官方一致、不暴露改造痕迹
          OFF_BODY=$(gh api repos/FongMi/Release/releases/tags/"$TAG" --jq '.body // ""')
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在（并发 run 撞车或补传场景）→ 幂等覆盖上传，并同步标题/说明
            gh release upload "$TAG" release/*.apk --clobber
            gh release edit "$TAG" --title "$TAG" --notes "$OFF_BODY"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$OFF_BODY" \
              release/*.apk
          fi
